<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="560" viewBox="0 0 1280 560" role="img" aria-labelledby="title desc">
  <title id="title">Post Grill Me: make agent assumptions reviewable</title>
  <desc id="desc">An inferred global export rule becomes a human-confirmed preview-only scope, preserved in a feature recap.</desc>
  <defs>
    <linearGradient id="bg" x2="1" y2="1"><stop stop-color="#101827"/><stop offset="1" stop-color="#17233b"/></linearGradient>
    <linearGradient id="accent" x2="1" y2="0"><stop stop-color="#7dd3fc"/><stop offset="1" stop-color="#a7f3d0"/></linearGradient>
  </defs>
  <rect width="1280" height="560" rx="24" fill="url(#bg)"/>
  <g font-family="Inter,Segoe UI,Arial,sans-serif">
    <text x="64" y="75" fill="#a5b4fc" font-size="18" font-weight="700" letter-spacing="3">POST-GRILL-ME</text>
    <text x="64" y="132" fill="#f8fafc" font-size="42" font-weight="700">Review what your agent thinks you meant.</text>
    <text x="64" y="174" fill="#cbd5e1" font-size="22">1–2 questions. A corrected scope. A feature story you can revisit.</text>
    <rect x="64" y="220" width="540" height="198" rx="18" fill="#1e293b" stroke="#475569"/>
    <text x="90" y="260" fill="#fbbf24" font-size="15" font-weight="700" letter-spacing="2">AGENT · INFERRED SCOPE</text>
    <text x="90" y="301" fill="#f8fafc" font-size="22">I applied the preview rule</text>
    <text x="90" y="333" fill="#f8fafc" font-size="22">to scheduled exports too.</text>
    <text x="90" y="383" fill="#cbd5e1" font-size="18">A: Preview only · B: Both paths</text>
    <path d="M620 316H660M649 306L660 316L649 326" stroke="#7dd3fc" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    <rect x="676" y="220" width="540" height="198" rx="18" fill="#15352f" stroke="#4f8c7b"/>
    <text x="702" y="260" fill="#a7f3d0" font-size="15" font-weight="700" letter-spacing="2">HUMAN · CLARIFIED SCOPE</text>
    <text x="702" y="301" fill="#f8fafc" font-size="22">Preview only.</text>
    <text x="702" y="333" fill="#f8fafc" font-size="22">Keep scheduled behavior.</text>
    <text x="702" y="383" fill="#bbf7d0" font-size="18">The recap keeps the boundary.</text>
    <rect x="64" y="456" width="1152" height="44" rx="12" fill="#0b1424"/>
    <text x="88" y="485" fill="#cbd5e1" font-size="18">grill-me → implement → post-grill-me → correct understanding → revisit later</text>
    <rect x="64" y="528" width="1152" height="4" rx="2" fill="url(#accent)"/>
  </g>
</svg>
